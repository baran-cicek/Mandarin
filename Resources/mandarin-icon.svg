<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mandarin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2128"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="300" y1="200" x2="760" y2="560">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF5E57"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#FF8A4C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>

  <!-- Wheel: six segments -->
  <g transform="rotate(-120 512 512)" fill="none" stroke-linecap="round" stroke-width="84">
    <circle cx="512" cy="512" r="290" stroke="#FFFFFF" stroke-opacity="0.9" stroke-dasharray="190 113.7"/>
    <!-- selected segment -->
    <circle cx="512" cy="512" r="290" stroke="url(#accent)" stroke-dasharray="190 1640"/>
  </g>

  <!-- Center: the dropped file -->
  <circle cx="512" cy="512" r="56" fill="url(#accent)"/>
</svg>
